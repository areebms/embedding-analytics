[pytest]
testpaths = tests
pythonpath = src ../../
addopts =
    --cov=app
    --cov=constants
    --cov=dependencies
    --cov=describe_services
    --cov=diachronic_services
    --cov=routers
    --cov=schemas
    --cov=services
    --cov-report=term-missing
    --cov-fail-under=85
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:fastapi_cache.*
    ignore::DeprecationWarning:mangum.*