# infra/services.yaml
# The service key is the Lambda function name (prefixed with LAMBDA_PREFIX at deploy
# time) and the functions/<key>/ directory; its ECR image is lambda-<key>.
default:
  memory: 256
  timeout: 120

services:
  scrape:
    env: [S3_BUCKET, PIPELINE_TABLE]

  standardize-headings:
    memory: 1024
    timeout: 600
    env: [S3_BUCKET, PIPELINE_TABLE, ANTHROPIC_API_KEY]

  tokenize:
    memory: 512

  train-kvector:
    memory: 1536
    timeout: 600

  align-kvectors: {}

  publish:
    memory: 512
    timeout: 300

  api:
    memory: 1024
