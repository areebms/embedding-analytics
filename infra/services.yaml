# infra/services.yaml

default:
  memory: 256
  timeout: 120

services:
  scrape:
    env: [S3_BUCKET, PIPELINE_TABLE]

  standardize-html:
    memory: 1024
    timeout: 600
    env: [S3_BUCKET, PIPELINE_TABLE, ANTHROPIC_API_KEY]

  tokenize:
    memory: 1769
    timeout: 900
    env: [S3_BUCKET, PIPELINE_TABLE]

  publish:
    memory: 512
    timeout: 300

  api:
    memory: 1024
